<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with rounded corners for iOS -->
  <defs>
    <linearGradient id="bgGradientApple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradientApple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f3f4f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Rounded rectangle background -->
  <rect x="10" y="10" width="160" height="160" rx="35" ry="35" fill="url(#bgGradientApple)" stroke="#1e40af" stroke-width="4"/>
  
  <!-- Main DOM text -->
  <text x="90" y="80" font-family="Arial, sans-serif" font-size="36" font-weight="bold" text-anchor="middle" fill="url(#textGradientApple)">DOM</text>
  
  <!-- Subtitle -->
  <text x="90" y="105" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#e5e7eb">INTERNATIONAL</text>
  
  <!-- Tagline -->
  <text x="90" y="125" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#d1d5db" opacity="0.8">Maximizing Potentials</text>
  <text x="90" y="140" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#d1d5db" opacity="0.8">Raising Leaders</text>
  
  <!-- Decorative elements -->
  <g fill="#fbbf24" opacity="0.9">
    <!-- Top crosses -->
    <rect x="40" y="30" width="3" height="12" rx="1.5"/>
    <rect x="34" y="36" width="15" height="3" rx="1.5"/>
    
    <rect x="130" y="30" width="3" height="12" rx="1.5"/>
    <rect x="124" y="36" width="15" height="3" rx="1.5"/>
    
    <!-- Bottom crosses -->
    <rect x="40" y="140" width="3" height="12" rx="1.5"/>
    <rect x="34" y="146" width="15" height="3" rx="1.5"/>
    
    <rect x="130" y="140" width="3" height="12" rx="1.5"/>
    <rect x="124" y="146" width="15" height="3" rx="1.5"/>
  </g>
  
  <!-- Central decorative line -->
  <line x1="50" y1="90" x2="130" y2="90" stroke="#fbbf24" stroke-width="2" opacity="0.7"/>
  
  <!-- Small decorative dots -->
  <circle cx="70" cy="60" r="2" fill="#fbbf24" opacity="0.6"/>
  <circle cx="110" cy="60" r="2" fill="#fbbf24" opacity="0.6"/>
  <circle cx="70" cy="120" r="2" fill="#fbbf24" opacity="0.6"/>
  <circle cx="110" cy="120" r="2" fill="#fbbf24" opacity="0.6"/>
</svg>
